<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estúdio 3D · Personagem Cartoon</title>
<style>
:root{--bg:#ece8f3;--pn:#fbf9fff2;--tx:#2b2438;--ac:#e0963f;--ac2:#3a3f66;--bd:#d6cfe3;--bt:#ece7f5;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1726;--pn:#272134f2;--tx:#f0eaf8;--bd:#4a3f5c;--bt:#352c45}}
:root[data-theme="dark"]{--bg:#1b1726;--pn:#272134f2;--tx:#f0eaf8;--bd:#4a3f5c;--bt:#352c45}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:14px/1.3 "Trebuchet MS",system-ui,sans-serif;overflow:hidden}
#app{position:relative;height:100%}
canvas{display:block;width:100%;height:100%;touch-action:none}
#top{position:absolute;top:10px;left:12px;right:12px;display:flex;align-items:center;gap:8px;pointer-events:none}
#top b{font-size:16px}#info{flex:1;font-size:12px;opacity:.75}
#top button{pointer-events:auto;width:40px;height:40px;border-radius:50%;font-size:17px;padding:0}
button{font:inherit;color:var(--tx);background:var(--bt);border:1px solid var(--bd);border-radius:10px;padding:9px 6px;cursor:pointer}
button.on{background:var(--ac);color:#2a1d10;border-color:var(--ac);font-weight:700}
#ui{position:absolute;left:0;right:0;bottom:0;background:var(--pn);border-top:1px solid var(--bd);border-radius:18px 18px 0 0;height:38%;display:flex;flex-direction:column;backdrop-filter:blur(8px)}
#tabs{display:flex;gap:6px;padding:10px 10px 4px}#tabs button{flex:1;border-radius:20px}
#pg{overflow:auto;padding:6px 10px 12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px;align-content:start}
.row{grid-column:1/-1;display:flex;align-items:center;gap:10px}.row input[type=range]{flex:1;accent-color:var(--ac)}
.cr{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:4px 8px;border:1px solid var(--bd);border-radius:10px;background:var(--bt)}
.cr input{width:34px;height:28px;border:none;background:none;padding:0}
#ov{position:absolute;inset:0;background:#000c;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff}
#ov[hidden]{display:none}#ov img{max-width:90%;max-height:70%;border-radius:12px}
</style></head><body>
<div id="app"><canvas id="cv"></canvas>
<div id="top"><b>Estúdio 3D</b><span id="info"></span><button id="pz" aria-label="Pausar">⏸</button><button id="ft" aria-label="Foto">📷</button></div>
<div id="ui"><div id="tabs"></div><div id="pg"></div></div>
<div id="ov" hidden><img id="im" alt="Captura"><p>Toque e segure a imagem para salvar</p><button id="cl">Fechar</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
<script>
const T=THREE,PI=Math.PI,S=Math.sin,C=Math.cos,ab=Math.abs,mx=Math.max,cl=(v,a,b)=>Math.min(b,Math.max(a,v));
const cv=document.getElementById('cv'),app=document.getElementById('app');
const R=new T.WebGLRenderer({canvas:cv,antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
R.outputColorSpace=T.SRGBColorSpace;R.shadowMap.enabled=true;R.shadowMap.type=T.PCFSoftShadowMap;
const sc=new T.Scene(),cam=new T.PerspectiveCamera(30,1,.05,60);
const hemi=new T.HemisphereLight(0xffffff,0xbfa8d9,.85);sc.add(hemi);
const sun=new T.DirectionalLight(0xfff4e4,1.15);sun.position.set(2.6,4.2,3.2);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-2,right:2,top:2.6,bottom:-1.5});sun.shadow.bias=-.0005;sc.add(sun);
const rim=new T.DirectionalLight(0xffd2ad,.65);rim.position.set(-3,2.5,-3);sc.add(rim);

// ---------- SHADER QUADRINHOS (Halftone + Contorno c/ Suporte a SkinnedMesh) ----------
const gm=new T.DataTexture(new Uint8Array([140,140,140,255,215,215,215,255,255,255,255,255]),3,1);
gm.minFilter=gm.magFilter=T.NearestFilter;gm.needsUpdate=true;
const htU={htScale:{value:6.5},htStr:{value:.34},lightDir:{value:new T.Vector3(2.6,4.2,3.2).normalize()}};

function injectHalftone(m){
  m.onBeforeCompile=sh=>{
    sh.uniforms.htScale=htU.htScale;sh.uniforms.htStr=htU.htStr;sh.uniforms.lightDir=htU.lightDir;
    sh.vertexShader=sh.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 vWN;');
    sh.vertexShader=sh.vertexShader.replace('#include <worldpos_vertex>','#include <worldpos_vertex>\nvWN=normalize((modelMatrix*vec4(transformedNormal,0.0)).xyz);');
    sh.fragmentShader=sh.fragmentShader.replace('#include <common>',`#include <common>
      varying vec3 vWN;uniform float htScale;uniform float htStr;uniform vec3 lightDir;`);
    sh.fragmentShader=sh.fragmentShader.replace('#include <dithering_fragment>',`#include <dithering_fragment>
      if(htStr>0.001){
        float ndl=dot(normalize(vWN),lightDir)*0.5+0.5;
        float shd=clamp(1.0-ndl*1.22,0.0,1.0);
        vec2 p=gl_FragCoord.xy/htScale;
        vec2 pr=vec2(p.x*0.866-p.y*0.5,p.x*0.5+p.y*0.866);
        vec2 g=fract(pr)-0.5;
        float d=length(g);
        float rad=smoothstep(0.12,0.72,shd)*0.68;
        float dotMask=1.0-smoothstep(rad-0.08,rad+0.08,d);
        float edgeZone=smoothstep(0.08,0.32,shd)*(1.0-smoothstep(0.68,0.92,shd));
        float finalDots=mix(step(0.55,shd)*0.45,dotMask,edgeZone*0.85+0.15);
        gl_FragColor.rgb*=1.0-finalDots*htStr;
      }`);
  };
  return m;
}

const MC={},mat=c=>MC[c]||(MC[c]=injectHalftone(new T.MeshToonMaterial({color:c,gradientMap:gm})));
const inkU={w:{value:.0048}};
function makeInk(skinned=false){
  return new T.ShaderMaterial({uniforms:inkU,side:T.BackSide,
    vertexShader:`uniform float w;
      #include <common>
      #include <skinning_pars_vertex>
      void main(){
        vec3 transformed=vec3(position);vec3 objectNormal=vec3(normal);
        ${skinned?'#include <skinbase_vertex>\n#include <skinnormal_vertex>\n#include <skinning_vertex>':''}
        vec4 p=modelViewMatrix*vec4(transformed,1.);
        vec3 n=normalize(normalMatrix*objectNormal);
        p.xyz+=n*w*clamp(-p.z/4.5,.45,2.);
        gl_Position=projectionMatrix*p;
      }`,
    fragmentShader:'void main(){gl_FragColor=vec4(.08,.065,.11,1.);}'});
}
const inkStatic=makeInk(false),inkSkin=makeInk(true),outs=[];

function mk(g,c,par,{o=1,p=[0,0,0],s=[1,1,1],r=[0,0,0],sh=1}={}){
  const m=new T.Mesh(g,mat(c));m.position.set(...p);m.scale.set(...s);m.rotation.set(...r);m.castShadow=!!sh;m.receiveShadow=true;
  if(o){const q=new T.Mesh(g,inkStatic);m.add(q);outs.push(q)}par.add(m);return m;
}
function mkSkinned(g,c,par,bones,{o=1}={}){
  const m=new T.SkinnedMesh(g,mat(c));m.castShadow=true;m.receiveShadow=true;
  const skel=new T.Skeleton(bones);
  m.add(bones[0]);m.bind(skel);par.add(m);
  if(o){const q=new T.SkinnedMesh(g,inkSkin);q.bind(skel);par.add(q);outs.push(q)}
  return m;
}
const G=(par,x,y,z)=>{const g=new T.Group();g.position.set(x,y,z);par.add(g);return g};
const B=(par,x,y,z)=>{const b=new T.Bone();b.position.set(x,y,z);if(par)par.add(b);return b};

// Cores fiéis à imagem de referência
const SK=0x78472a,HAIR=0x1e1d22,OR=0xd47a2e,NV=0x28334e,GR=0x706e6b,SH=0x24293d,SOLE=0x191b24;
const DEF={[SK]:SK,[HAIR]:HAIR,[OR]:OR,[NV]:NV,[GR]:GR,[SH]:SH};
const cap=(r,l,rs=8,cs=18)=>new T.CapsuleGeometry(r,l,rs,cs),sph=(r,a=22,b=16)=>new T.SphereGeometry(r,a,b);

// ---------- CENÁRIO ----------
const ground=injectHalftone(new T.MeshToonMaterial({color:0xdad4e6,gradientMap:gm}));
const groundM=new T.Mesh(new T.CircleGeometry(5,64),ground);
groundM.rotation.x=-PI/2;groundM.receiveShadow=true;sc.add(groundM);
const root=new T.Group();sc.add(root);
const stool=G(root,0,0,-.02);mk(new T.CylinderGeometry(.22,.20,.405,24),0x5d6fa8,stool,{p:[0,.2,0]});stool.visible=false;

// ---------- HIERARQUIA PRINCIPAL ----------
const HY=.96,hips=G(root,0,HY,0),spine=G(hips,0,.02,0),neck=G(spine,0,.53,0),head=G(neck,0,.08,0);

// ---------- MOLETOM VOLUMÉTRICO COM DOBRAS E RECORTE RAGLAN ----------
function buildSweater(){
  const segY=36,segR=36;
  const g=new T.CylinderGeometry(1,1,.55,segR,segY,false);
  const pos=g.attributes.position;
  for(let i=0;i<pos.count;i++){
    const vx=pos.getX(i),vy=pos.getY(i),vz=pos.getZ(i);
    const u=(vy+.275)/.55; // 0 (barra inferior) a 1 (ombros/gola)
    const ang=Math.atan2(vx,vz),rad=Math.hypot(vx,vz);
    if(rad<1e-4){pos.setY(i,u>.5?.475:-.08);continue;}
    const nx=vx/rad,nz=vz/rad;
    // Silhueta encorpada com caimento blusado (blouson) acima da barra
    let rx=.182,rz=.126;
    const pouch=Math.exp(-((u-.16)/.11)**2)*.024;
    const chest=S(u*PI)*.018+cl((u-.55)*.04,0,.022);
    const fold=(u>.1&&u<.45)?(S(u*28+ang*2)*.0045+S(u*44-ang*3)*.003)*(1-ab(u-.26)/.2):0;
    rx+=pouch+chest+fold;
    rz+=(pouch+chest)*.78+fold;
    // Leve recuo na barra canelada inferior
    if(u<.11){const t=u/.11;rx-=(1-t)*.014;rz-=(1-t)*.011;}
    // Fechamento suave nos ombros
    if(u>.84){const t=(u-.84)/.16;rx*=1-t*.56;rz*=1-t*.56;}
    pos.setXYZ(i,nx*rx,vy+.195,nz*rz);
  }
  g.computeVertexNormals();
  return g;
}
mk(buildSweater(),OR,spine);

// Barra canelada inferior azul-marinho (com textura de gomos verticais)
function buildRibHem(){
  const g=new T.CylinderGeometry(.176,.170,.068,48,4);
  const p=g.attributes.position;
  for(let i=0;i<p.count;i++){
    const x=p.getX(i),y=p.getY(i),z=p.getZ(i),a=Math.atan2(x,z);
    const rib=1+S(a*36)*.008;
    p.setXYZ(i,x*1.04*rib,y-.065,z*.71*rib);
  }
  g.computeVertexNormals();return g;
}
mk(buildRibHem(),NV,spine);

// Recortes diagonais nos ombros (raglan azul-marinho igual à imagem)
function buildShoulderYoke(){
  const g=new T.CylinderGeometry(.088,.192,.185,36,12,true);
  const p=g.attributes.position;
  for(let i=0;i<p.count;i++){
    const x=p.getX(i),y=p.getY(i),z=p.getZ(i);
    const u=(y+.0925)/.185; // 0 baixo, 1 topo
    const ax=ab(x);
    // Só aparece nas laterais dos ombros em corte diagonal raglan
    const diag=cl((ax-.065)/.11,0,1);
    const yShift=(1-diag)*(1-u)*.085;
    p.setXYZ(i,x*1.05,y+.395+yShift,z*.71);
  }
  g.computeVertexNormals();return g;
}
mk(buildShoulderYoke(),NV,spine);

// Gola V canelada azul-marinho + pescoço
function buildVCollar(){
  const g=new T.TorusGeometry(.078,.021,12,32);
  const p=g.attributes.position;
  for(let i=0;i<p.count;i++){
    const x=p.getX(i),y=p.getY(i),z=p.getZ(i);
    // Na rotação X=PI/2, Y positivo aponta para frente (+Z)
    const vDip=y>.02?Math.pow((y-.02)/.08,1.4)*.048:0;
    p.setXYZ(i,x*1.08,y*.92,z+vDip);
  }
  g.computeVertexNormals();return g;
}
mk(buildVCollar(),NV,spine,{p:[0,.468,.006],r:[PI/2+.18,0,0]});
mk(new T.CylinderGeometry(.054,.062,.14,18),SK,neck,{p:[0,.03,0]});

// Emblema "02" estilizado no peito esquerdo (igual à referência)
const ec=document.createElement('canvas');ec.width=ec.height=128;const ex=ec.getContext('2d');
ex.fillStyle='#f5f3ef';ex.strokeStyle='#1f263d';ex.lineWidth=8;ex.lineJoin='round';
const rRect=(x,y,w,h,r)=>{ex.beginPath();ex.moveTo(x+r,y);ex.arcTo(x+w,y,x+w,y+h,r);ex.arcTo(x+w,y+h,x,y+h,r);ex.arcTo(x,y+h,x,y,r);ex.arcTo(x,y,x+w,y,r);ex.closePath();ex.fill();ex.stroke()};
rRect(24,14,52,70,14);rRect(48,46,54,66,14);
ex.fillStyle='#1f263d';ex.fillRect(42,32,16,32);ex.fillRect(64,68,20,24);
const et=new T.CanvasTexture(ec);et.colorSpace=T.SRGBColorSpace;
const em=new T.Mesh(new T.PlaneGeometry(.058,.068),new T.MeshToonMaterial({map:et,gradientMap:gm,transparent:true,polygonOffset:true,polygonOffsetFactor:-2}));
em.position.set(-.088,.335,.129);em.rotation.set(-.08,-.32,0);spine.add(em);

// ---------- MANGAS CONTÍNUAS (SkinnedMesh sem cortes no cotovelo!) ----------
function createContinuousArm(s){
  const bSh=B(spine,.192*s,.435,0);
  const bEl=B(bSh,0,-.255,0);
  const bWr=B(bEl,0,-.245,0);

  const segY=34,segR=24,len=.49;
  const g=new T.CylinderGeometry(1,1,len,segR,segY,false);
  const pos=g.attributes.position;
  const sIdx=[],sWgt=[];

  for(let i=0;i<pos.count;i++){
    const vx=pos.getX(i),vy=pos.getY(i),vz=pos.getZ(i);
    const u=(len/2-vy)/len; // 0 no ombro -> 1 no punho
    const yLocal=-u*len;
    const ang=Math.atan2(vx,vz),rad=Math.hypot(vx,vz);
    const nx=rad>1e-4?vx/rad:0,nz=rad>1e-4?vz/rad:0;

    // Volume encorpado de manga de moletom com dobras no cotovelo e punho
    let r=.072*(1-u*.12)+S(u*PI)*.014;
    const elbowBulge=Math.exp(-((u-.52)/.14)**2)*.007;
    const cuffPouch=Math.exp(-((u-.84)/.09)**2)*.016;
    const folds=(u>.35&&u<.88)?(S(u*34+ang*2)*.0038+C(u*22-ang)*.0025):0;
    r+=elbowBulge+cuffPouch+folds;
    if(u>.90)r*=.72; // entra dentro do punho azul

    if(rad<1e-4){pos.setXYZ(i,0,u<.5?0:-len,0);}
    else{
      // Arredonda o topo do ombro
      const capY=u<.08?Math.sqrt(mx(0,1-(1-u/.08)**2))*0-.02*(1-u/.08):0;
      pos.setXYZ(i,nx*r,yLocal-capY,nz*r*.94);
    }

    // Pesos suaves de Skinning entre Ombro (0) e Cotovelo (1)
    const wEl=cl((u-.36)/.28,0,1);
    const sm=wEl*wEl*(3-2*wEl);
    sIdx.push(0,1,0,0);sWgt.push(1-sm,sm,0,0);
  }
  g.setAttribute('skinIndex',new T.Uint16BufferAttribute(sIdx,4));
  g.setAttribute('skinWeight',new T.Float32BufferAttribute(sWgt,4));
  g.computeVertexNormals();
  mkSkinned(g,OR,spine,[bSh,bEl,bWr]);

  // Detalhe raglan azul-marinho no topo da manga
  const capG=new T.SphereGeometry(.076,20,14,0,PI*2,0,PI*.58);
  mk(capG,NV,bSh,{p:[0,-.01,0],s:[1.02,1.15,.95],r:[0,0,-s*.22]});

  // Punho canelado azul-marinho preso ao antebraço
  const cuffG=new T.CylinderGeometry(.058,.052,.062,28,3);
  const cp=cuffG.attributes.position;
  for(let i=0;i<cp.count;i++){
    const a=Math.atan2(cp.getX(i),cp.getZ(i)),rib=1+S(a*24)*.012;
    cp.setX(i,cp.getX(i)*rib);cp.setZ(i,cp.getZ(i)*rib);
  }
  cuffG.computeVertexNormals();
  mk(cuffG,NV,bEl,{p:[0,-.228,0]});

  // Mão estilizada e encorpada presa ao punho
  const hd=G(bEl,0,-.265,0);
  mk(sph(.046,16,12),SK,hd,{p:[0,-.032,0],s:[.74,1.08,.96]});
  for(let i=0;i<4;i++){
    const fx=-s*.005,fy=-.082+ab(i-1.5)*.005,fz=-.024+i*.0155;
    mk(cap(.0135,.038,6,12),SK,hd,{p:[fx,fy,fz],r:[.08,0,s*.14]});
  }
  mk(cap(.0145,.034,6,12),SK,hd,{p:[-s*.018,-.036,.034],r:[.58,0,-s*.35]});
  return[bSh,bEl];
}

// ---------- CALÇA BAGGY CONTÍNUA (SkinnedMesh sem cortes no quadril ou joelho!) ----------
function buildContinuousPants(bPelvis,bThL,bKnL,bThR,bKnR){
  // Pelvis / Gancho central da calça baggy
  const pelG=new T.CylinderGeometry(.175,.192,.21,36,10);
  const pp=pelG.attributes.position;
  for(let i=0;i<pp.count;i++){
    const x=pp.getX(i),y=pp.getY(i),z=pp.getZ(i);
    const u=(y+.105)/.21;
    // Costura central da braguilha
    const seam=(ab(x)<.014&&z>0)?-.005:0;
    pp.setXYZ(i,x*1.06,y-.055,(z+seam)*.74);
  }
  pelG.computeVertexNormals();
  mk(pelG,GR,bPelvis);

  // Pernas da calça largas com dobras pesadas sobre o tênis
  function makePantLeg(s,idxTh,idxKn){
    const segY=44,segR=30,len=.83;
    const g=new T.CylinderGeometry(1,1,len,segR,segY,false);
    const pos=g.attributes.position;
    const sIdx=[],sWgt=[];

    for(let i=0;i<pos.count;i++){
      const vx=pos.getX(i),vy=pos.getY(i),vz=pos.getZ(i);
      const u=(len/2-vy)/len; // 0 quadril -> 1 barra do tornozelo
      const yLocal=-u*len;
      const ang=Math.atan2(vx,vz),rad=Math.hypot(vx,vz);
      const nx=rad>1e-4?vx/rad:0,nz=rad>1e-4?vz/rad:0;

      // Silhueta wide-leg / flare igual à imagem
      let rx=.108+u*.036+S(u*PI)*.012;
      let rz=.098+u*.034+S(u*PI)*.010;

      // Dobras empilhadas (stacking folds) nos tornozelos e joelhos
      const kneeFold=Math.exp(-((u-.48)/.12)**2)*S(u*32+ang*2)*.006;
      const stackZone=cl((u-.62)/.38,0,1);
      const stackFold=stackZone*(S(u*42+ang*2*s)*.013+C(u*64-ang)*.008);
      rx+=kneeFold+stackFold;
      rz+=kneeFold+stackFold*.85;

      // Costura lateral suave
      const sideSeam=ab(ab(ang)-PI/2)<.12?-.003:0;
      rx+=sideSeam;

      // Leve caimento para fora na barra
      const swayX=s*(u*.016+stackZone*S(u*18)*.007);
      const swayZ=stackZone*.012;

      if(rad<1e-4){pos.setXYZ(i,.095*s+swayX,u<.5?-.02:-len-.02,swayZ);}
      else{pos.setXYZ(i,.095*s+nx*rx+swayX,yLocal-.02,nz*rz+swayZ);}

      // Pesos suaves: Pelvis (0) no topo, Coxa (idxTh) no meio, Canela (idxKn) embaixo
      let wP=cl(1-u/.18,0,1);wP=wP*wP*(3-2*wP);
      let wK=cl((u-.38)/.24,0,1);wK=wK*wK*(3-2*wK);
      let wT=mx(0,1-wP-wK);
      sIdx.push(0,idxTh,idxKn,0);
      sWgt.push(wP,wT,wK,0);
    }
    g.setAttribute('skinIndex',new T.Uint16BufferAttribute(sIdx,4));
    g.setAttribute('skinWeight',new T.Float32BufferAttribute(sWgt,4));
    g.computeVertexNormals();
    return g;
  }

  const bones=[bPelvis,bThL,bKnL,bThR,bKnR];
  mkSkinned(makePantLeg(1,1,2),GR,hips,bones);
  mkSkinned(makePantLeg(-1,3,4),GR,hips,bones);
}

function buildShoe(par,s){
  const an=G(par,0,-.42,0);
  // Cabedal volumoso estilo sneaker chunky azul-escuro
  const upG=sph(1,24,16);
  const p=upG.attributes.position;
  for(let i=0;i<p.count;i++){
    const x=p.getX(i),y=p.getY(i),z=p.getZ(i);
    p.setXYZ(i,x*.088*(z>0?1.06:.95),y<0?y*.022:y*.068,z*.152);
  }
  upG.computeVertexNormals();
  mk(upG,SH,an,{p:[s*.008,-.048,.045]});
  // Sola grossa escura com recorte de salto
  mk(new T.CylinderGeometry(1,1,1,28),SOLE,an,{p:[s*.008,-.066,.045],s:[.094,.024,.158]});
  // Detalhe de costura frontal e cadarços
  mk(new T.TorusGeometry(.052,.004,8,20,PI),SOLE,an,{o:0,p:[s*.008,-.036,.078],r:[1.25,0,0],s:[1.2,1,.8]});
  [-.01,.015].forEach(z=>mk(cap(.005,.046,4,8),SOLE,an,{o:0,p:[s*.008,-.008,.03+z],r:[0,0,PI/2]}));
}

function deformHead(g,r){
  const p=g.attributes.position;
  for(let i=0;i<p.count;i++){
    const y=p.getY(i)/r;
    if(y<0){
      const k=y*y;
      p.setX(i,p.getX(i)*(1-.33*k));
      p.setZ(i,p.getZ(i)*(1-.08*k));
      p.setY(i,p.getY(i)*(1+.08*k));
    }
  }
  g.computeVertexNormals();return g;
}

// Construtor de mechas grossas prismáticas chanfradas (estilo box-dreads da imagem)
function makeThickLockGeo(w,d,h,curve=.018){
  const g=new T.BoxGeometry(w,h,d,2,7,2);
  const p=g.attributes.position;
  for(let i=0;i<p.count;i++){
    let x=p.getX(i),y=p.getY(i),z=p.getZ(i);
    const u=(y+h/2)/h; // 0 na raiz -> 1 na ponta
    // Leve expansão no meio e ponta chanfrada quadrada (não pontuda)
    const prof=u<.82?(.82+.32*S(u/.82*PI*.75)):(1.14-(u-.82)/.18*.42);
    // Chanfro nas quinas para parecer modelado em argila/vinil 3D
    const nx=ab(x)/(w*.5+1e-5),nz=ab(z)/(d*.5+1e-5);
    const bevel=1-.14*(nx*nz);
    x*=prof*bevel;
    z*=prof*bevel;
    // Curvatura orgânica leve
    z+=S(u*PI)*curve;
    if(u>.92)y-=((nx*nx+nz*nz)*.5)*.012;
    p.setXYZ(i,x,y+h*.44,z);
  }
  g.computeVertexNormals();return g;
}

const X=new T.Vector3(),Y=new T.Vector3(),Z=new T.Vector3(),M4=new T.Matrix4();
function addLock(par,posVec,dirVec,upHint,w,d,h,curve=.015){
  const m=mk(makeThickLockGeo(w,d,h,curve),HAIR,par);
  Y.copy(dirVec).normalize();
  Z.copy(upHint).addScaledVector(Y,-upHint.dot(Y));
  if(Z.lengthSq()<1e-4)Z.set(0,0,1).addScaledVector(Y,-Y.z);
  Z.normalize();X.crossVectors(Y,Z);
  M4.makeBasis(X,Y,Z);
  m.quaternion.setFromRotationMatrix(M4);
  m.position.copy(posVec);
  return m;
}

  const k=1-Math.exp(-dt*14);
  names.forEach(n=>{for(let i=0;i<3;i++)cur[n][i]+=(o[n][i]-cur[n][i])*k;rig[n].rotation.set(...cur[n])});
  const py=cy;cy+=(o.y-cy)*k;cx+=(o.rx-cx)*k;hips.position.y=HY+cy;root.position.x=cx;stool.visible=clip==='sit';
  const br=1+.012*S(tt*2.2);spine.scale.set(br,1,br);
  const tg=[cur.hd[0]+cur.sp[0],cur.hd[1]+cur.sp[1],cur.hd[2]+cur.sp[2]],kh=1-Math.exp(-dt*7);
  for(let i=0;i<3;i++)lag[i]+=(tg[i]-lag[i])*kh;
  vy+=((cy-py)/Math.max(dt,1e-3)-vy)*kh;
  hairG.rotation.set(cl((lag[0]-tg[0])*.45,-.12,.12),cl((lag[1]-tg[1])*.3,-.1,.1),cl((lag[2]-tg[2])*.45,-.12,.12));
  hairG.scale.y=1-cl(vy*.05,-.04,.04);
  const e=EX[exN];lift+=((e.lift||0)-lift)*(1-Math.exp(-dt*10));fr.rotation.x=-lift*.75;
  if(!paused){nextBlink-=dt;if(nextBlink<0){blinkT=.14;nextBlink=2+rnd()*3}blinkT=mx(0,blinkT-dt)}
  const bl=blinkOn&&blinkT>0?.12:1;
  let tk=-1;if(talkOn||clip==='talk'){const v=.5+.5*S(tt*13)*S(tt*4.7+1);tk=S(tt*2.1)>-.7?Math.round(v*3)/3:0}
  let tx=e.px||0,ty2=e.py||0;
  if(lookCam&&!e.blank){hc.updateWorldMatrix(true,false);V.copy(cam.position);hc.worldToLocal(V).normalize();if(V.z>.1){tx=cl(V.x*2.4,-1,1);ty2=cl(-V.y*2.4,-1,1)}}
  elx+=(tx-elx)*k;ely+=(ty2-ely)*k;
  drawFace(exN,bl,tk,Math.round(elx*20)/20,Math.round(ely*20)/20);
  if(spin&&!down)G_.az+=dt*.6;
  az+=(G_.az-az)*.15;el+=(G_.el-el)*.15;ds+=(G_.ds-ds)*.15;ty+=(G_.ty-ty)*.15;
  cam.position.set(S(az)*C(el)*ds,ty+S(el)*ds,C(az)*C(el)*ds);cam.lookAt(0,ty,0);
  R.render(sc,cam);
}

// ---------- CÂMERA ----------
let az=.35,el=.08,ds=5.4,ty=.98,down=0;const G_={az:.35,el:.08,ds:5.4,ty:.98},ptr=new Map();let pd=0;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);down=ptr.size;pd=0});
cv.addEventListener('pointerup',e=>{ptr.delete(e.pointerId);down=ptr.size});cv.addEventListener('pointercancel',e=>{ptr.delete(e.pointerId);down=ptr.size});
cv.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId))return;const p=ptr.get(e.pointerId);
  if(ptr.size===1){G_.az-=(e.clientX-p[0])*.008;G_.el=cl(G_.el+(e.clientY-p[1])*.005,-.2,1.3)}
  ptr.set(e.pointerId,[e.clientX,e.clientY]);
  if(ptr.size===2){const[a,b]=[...ptr.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(pd)G_.ds=cl(G_.ds*pd/d,1.2,9);pd=d}});
cv.addEventListener('wheel',e=>{e.preventDefault();G_.ds=cl(G_.ds*(1+e.deltaY*.001),1.2,9)},{passive:false});
function view(a,e,d,y){G_.az=az+((((a-az+PI)%(2*PI))+2*PI)%(2*PI)-PI);G_.el=e;G_.ds=d;G_.ty=y}

// ---------- INTERFACE ----------
const pg=document.getElementById('pg'),tabs=document.getElementById('tabs'),info=document.getElementById('info');
function chip(label,fn,grp,on){const b=document.createElement('button');b.textContent=label;if(on)b.classList.add('on');
  b.onclick=()=>{if(grp){grp.forEach(x=>x.classList.remove('on'));b.classList.add('on')}fn()};if(grp)grp.push(b);pg.append(b);return b}
function row(html,cls='row'){const d=document.createElement('label');d.className=cls;d.innerHTML=html;pg.append(d);return d.querySelector('input')}
function check(label,val,fn){const i=row('<input type="checkbox"> '+label);i.checked=val;i.onchange=()=>fn(i.checked);return i}
function setInfo(){info.textContent=CN[clip]+' · '+EXN[exN]}
function setEx(n){exN=n;setInfo()}
function play(id){clip=id;tt=0;if(auto&&exN!=='semrosto')setEx(DX[id]||'neutro');setInfo()}
const BG=[['Estúdio',0xece8f3,0xdad4e6,.85,1.15],['Branco (Ref)',0xfaf9fc,0xefedf4,.95,1.15],['Pôr do sol',0xff9d84,0xc99fbd,.7,.95],['Noite',0x2b2748,0x4a4570,.45,.55]];
let bgI=0;function setBg(i){bgI=i;const b=BG[i];sc.background=new T.Color(b[1]);sc.fog=new T.Fog(b[1],9,22);ground.color.set(b[2]);hemi.intensity=b[3];sun.intensity=b[4]}
const COL=[['Pele',SK],['Cabelo',HAIR],['Blusa',OR],['Detalhes',NV],['Calça',GR],['Tênis',SH]];
const PAGES={
 'Ações':()=>{const g=[];Object.keys(CN).forEach(id=>chip(CN[id],()=>play(id),g,id===clip))},
 'Rosto':()=>{const g=[];let acEl;Object.keys(EX).forEach(n=>chip(EXN[n],()=>{if(n==='semrosto'){auto=false;acEl.checked=false}setEx(n)},g,n===exN));
  acEl=check('Expressão automática da ação',auto,v=>auto=v);
  check('Piscar',blinkOn,v=>blinkOn=v);check('Falando',talkOn,v=>talkOn=v);check('Olhar para a câmera',lookCam,v=>lookCam=v)},
 'Câmera':()=>{[['Frente',0,.06,5.4,.98],['Perfil',PI/2,.08,5.4,.98],['Costas',PI,.08,5.4,.98],['3/4',.65,.14,5.4,.98],['Rosto',.2,.02,1.65,1.76],['Corpo todo',.35,.18,6.8,.98]].forEach(v=>chip(v[0],()=>view(...v.slice(1))));
  check('Girar sozinha',spin,v=>spin=v);
  const s=row('Velocidade <input type="range" min=".2" max="2" step=".1">');s.value=spd;s.oninput=()=>spd=+s.value},
 'Visual':()=>{const g=[];BG.forEach((b,i)=>chip(b[0],()=>setBg(i),g,i===bgI));
  const s=row('Contorno <input type="range" min="0" max="12" step=".5">');s.value=inkU.w.value*1000;
  s.oninput=()=>{inkU.w.value=s.value/1000;outs.forEach(q=>q.visible=s.value>0)};
  const hs=row('Pontos HQ (Sombra) <input type="range" min="0" max=".65" step=".02">');hs.value=htU.htStr.value;
  hs.oninput=()=>htU.htStr.value=+hs.value;
  const hsz=row('Tamanho dos Pontos <input type="range" min="3.5" max="12" step=".5">');hsz.value=htU.htScale.value;
  hsz.oninput=()=>htU.htScale.value=+hsz.value;
  COL.forEach(([l,k])=>{const i=row(l+' <input type="color">','cr');i.value='#'+MC[k].color.getHexString();i.oninput=()=>MC[k].color.set(i.value)});
  chip('Cores originais',()=>{COL.forEach(([,k])=>MC[k].color.set(DEF[k]));tb[3].click()})}};
const tb=[];
Object.keys(PAGES).forEach((k,i)=>{const b=document.createElement('button');b.textContent=k;b.onclick=()=>{tb.forEach(x=>x.classList.remove('on'));b.classList.add('on');pg.innerHTML='';PAGES[k]()};tabs.append(b);tb.push(b);if(!i)b.classList.add('on')});
PAGES['Ações']();
document.getElementById('pz').onclick=e=>{paused=!paused;e.currentTarget.textContent=paused?'▶':'⏸'};
document.getElementById('ft').onclick=()=>{R.render(sc,cam);document.getElementById('im').src=cv.toDataURL('image/png');document.getElementById('ov').hidden=false};
document.getElementById('cl').onclick=()=>document.getElementById('ov').hidden=true;
function rs(){const w=app.clientWidth,h=app.clientHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.setViewOffset(w,h,0,h*.17,w,h);cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();setBg(0);setInfo();frame();
</script></body></html>
